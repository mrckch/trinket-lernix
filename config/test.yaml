app:
  usersubdomains: false
  start: false
  auth:
    mode: dev   # Tests registrieren und melden sich lokal an
    requireLogin: false   # wird in test/lib/api/access.js gezielt eingeschaltet
  plugins:
    session:
      cookieOptions:
        password: 'test-session-secret-nur-fuer-mocha-mindestens-32-zeichen'
        isSecure: false
  log:
    level: error
  trinketLibraryUser: testlibraryuser
db:
  mongo:
    host: localhost
    port: 27017
    database: test
  redis:
    enabled: false   # In-Memory-Store, kein Redis im Test nötig
