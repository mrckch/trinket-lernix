<form method="post" action="/admin/upload">
  <div class="row">
    <div class="small-12 columns">
      <label>Füge die Konten im CSV-Format ein (eine Zeile pro Konto). Die Kopfzeile muss genau so lauten wie im Beispiel. Pflichtspalten: Email, Password. Optional: Username (Benutzername), Name (vollständiger Name)
        <textarea name="userList" rows="10" placeholder="Email,Password,Username,Name
max.muster@example.com,Passwort123,max.muster,Max Muster
erika.beispiel@example.com,Passwort456,erika.beispiel,Erika Beispiel"></textarea>
      </label>
    </div>
  </div>
  <div class="row">
    <div class="small-12 columns">
      <input class="button primary" type="submit" value="Konten anlegen" />
    </div>
  </div>
</form>

{% if success is defined %}
<hr>
<div class="row">
  <div class="small-12 columns">
    <div class="alert-box success">
      Erfolgreich angelegte Konten: {{ success }}
    </div>
    {% if errors > 0 %}
    <div class="alert-box warning">
      Fehler: {{ errors }} (doppelte E-Mail-Adressen oder ungültige Daten)
    </div>
    {% endif %}
  </div>
</div>
{% endif %}
