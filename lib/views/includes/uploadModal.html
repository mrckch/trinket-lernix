<div id="uploadModal" class="reveal-modal medium" data-reveal>
  <h2>Blöcke aus XML-Datei laden</h2>
  <p class="lead">Die XML-Datei muss aus einem anderen Trinket heruntergeladen worden sein.</p>
  <label for="blocks-upload" class="small button">Datei auswählen</label>
  <input type="file" name="blocks_upload" id="blocks-upload" class="show-for-sr">
  <span id="blocks-upload-filename">[keine Datei ausgewählt]</span>
  <br />
  <a class="menu-button small button primary blocks-button disabled" data-action="code.replace-blocks">Vorhandene Blöcke ersetzen</a>
  <a class="menu-button small button primary blocks-button disabled" data-action="code.add-blocks">Blöcke hinzufügen</a>
  <div id="uploadMessage" class="hide"></div>
  <a class="close-reveal-modal">&#215;</a>
</div>
