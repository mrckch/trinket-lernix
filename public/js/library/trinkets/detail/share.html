<div class="row collapse">
  <p>Dieses Trinket ist für angemeldete Nutzer unter dem folgenden Link erreichbar.</p>
</div>
<form>
  <div class="row collapse">
    <div class="small-10 collapse">
      <div class="faux-input" ng-bind="trinketUrl" ng-text-select></div>
    </div>
  </div>
  <fieldset>
    <legend>Link-Optionen</legend>
    <div class="row collapse">
      <div class="small-10">
        <select name="displayOptionLink" ng-model="info.shareDisplayMenu">
          <option value="">Code und Ausgabe nebeneinander (kleine Bildschirme zeigen nur eines)</option>
          <option value="shareOutputOnly">Nur Ausgabe (Code ausblenden)</option>
          <option value="shareToggleCode">Nur Code oder Ausgabe (umschaltbar)</option>
        </select>
      </div>
    </div>
  </fieldset>
  <fieldset ng-show="runOption">
    <legend>Ausführen</legend>
    <div class="row collapse">
      <div class="small-10">
        <select name="runOptionLink" ng-model="info.shareRunMenu">
          <option value="">Ausführen und interaktive Konsole erlauben</option>
          <option value="shareRunOption">Nur Ausführen</option>
          <option value="shareConsoleOption">Nur interaktive Konsole</option>
        </select>
      </div>
    </div>
  </fieldset>
</form>
