<p ng-show="!interactions">
  <i class="fa fa-spinner fa-spin"></i> Wird geladen …
</p>
<table id="interactionsTable" ng-show="interactions && interactions.length">
  <tbody>
    <tr ng-repeat="interaction in interactions">
      <td>
         {{ interactionMap[interaction.action] }} {{ interaction.interacted | formatDate }}
         <span ng-if='interaction.referer_host'>
           von <a href='{{ interaction.referer }}' target='_blank'>{{ interaction.referer_host }}</a>
         </span>
      </td>
    </tr>
  </tbody>
</table>
<p ng-show="interactions && !interactions.length">
  Mit diesem Trinket hat noch niemand interagiert.<br />
  <a ui-sref="detail.embed">Bette es ein</a> oder <a ui-sref="detail.share">teile den Link</a>.
</p>
