<p>Der Operator <code>and</code> liefert nur dann <code>True</code>, wenn beide Seiten wahr sind:</p>
<table>
<tbody><tr><th>Ausdruck</th><th>Ergebnis</th></tr>
<tr><td>True <code>and</code> True</td><td>True</td></tr>
<tr><td>True <code>and</code> False</td><td>False</td></tr>
<tr><td>False <code>and</code> True</td><td>False</td></tr>
<tr><td>False <code>and</code> False</td><td>False</td></tr>
</tbody></table>
<p>Ist die erste Seite schon falsch, prüft Python die zweite gar nicht mehr.</p>
