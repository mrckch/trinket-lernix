<p>Mit <code>assert</code> prüfst du eine Annahme im Programm. Ist sie falsch, bricht Python mit einem <code>AssertionError</code> ab.</p>
<p>Die einfache Form <code>assert &lt;Bedingung&gt;</code> entspricht:</p>
<pre><code>if not &lt;Bedingung&gt;:
    raise AssertionError
</code></pre>
<p>Mit <code>assert &lt;Bedingung&gt;, &lt;Meldung&gt;</code> gibst du zusätzlich eine Fehlermeldung an.</p>
