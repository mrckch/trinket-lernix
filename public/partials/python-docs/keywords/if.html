<p>Mit <code>if</code> führt Python Anweisungen nur aus, wenn eine Bedingung wahr ist:</p>
<pre><code>if True:
    print("Das stimmt!")
</code></pre>
<p>Hier wird der Text ausgegeben. Wäre die Bedingung dagegen falsch:</p>
<pre><code>if False:
    print("Das stimmt nicht!")
</code></pre>
<p>… dann passiert nichts, weil der <code>if</code>-Block übersprungen wird.</p>
