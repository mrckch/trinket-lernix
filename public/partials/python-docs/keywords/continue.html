<p>Mit <code>continue</code> springst du sofort zum nächsten Durchlauf einer <code>while</code>- oder <code>for</code>-Schleife.</p>
<pre><code>for x in range(1, 10):
    if x == 5:
        continue
    print(x)
</code></pre>
<p>Die 5 wird hier nicht ausgegeben: Bei <code>x == 5</code> überspringt <code>continue</code> den Rest des Schleifenkörpers, und es geht mit 6 weiter.</p>
