<p>Mit <code>break</code> verlässt du eine <code>while</code>- oder <code>for</code>-Schleife vorzeitig.</p>
<pre><code>for x in range(3):
    print(x)
    if x == 1:
        break
</code></pre>
<p>Obwohl <code>range(3)</code> drei Durchläufe vorsieht, werden nur <code>0</code> und <code>1</code> ausgegeben: Im zweiten Durchlauf beendet <code>break</code> die Schleife.</p>
