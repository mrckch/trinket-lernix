# Nginx Proxy Manager → Proxy Host trinket.lernix.site → Reiter "Advanced"
# Admin-Bereich nur aus dem Verwaltungsnetz; Werte mit ADMIN_IP_ALLOWLIST in der .env abgleichen.
# Die App prüft dieselbe Liste selbst (lib/util/clientIp.js) – dieser Block ist die zusätzliche Schicht.

location ~ ^/(admin|api/admin) {
    allow 192.168.1.0/24;   # Heimnetz
    # allow <öffentliche Schul-IP>/32;
    deny  all;
    include conf.d/include/proxy.conf;
}
